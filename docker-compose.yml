services:
  faq:
    build: .
    container_name: essec-faq
    ports:
      - "3000:3000"
    environment:
      # Les cles API sont lues depuis votre fichier .env (jamais dans l'image).
      ELK_URL: ${ELK_URL:-https://myelk.essec.fr/myessec_faq/_search}
      ELK_API_KEY: ${ELK_API_KEY:?Definir ELK_API_KEY dans le fichier .env}
      ELK_INSECURE: ${ELK_INSECURE:-false}
      CANDIDATES: ${CANDIDATES:-10}
      MAX_SOURCES: ${MAX_SOURCES:-3}
      # RAG Databricks (facultatif : si URL ou token vide, bascule sur la synthese sans IA)
      DATABRICKS_URL: ${DATABRICKS_URL:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      SCORE_MIN: ${SCORE_MIN:-3}
      SYNTH_MIN_COVERAGE: ${SYNTH_MIN_COVERAGE:-0.5}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      PORT: 3000
    volumes:
      # Persiste le journal d'audit dans ./logs sur la machine hote
      - ./logs:/app/logs
    restart: unless-stopped
