<svg xmlns="http://www.w3.org/2000/svg" width="920" height="648" viewBox="0 0 920 648" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Technologies utilisees pour le developpement de l'assistant FAQ ESSEC">
  <defs>
    <style>
      .card   { fill:#ffffff; stroke:#e2e8f0; stroke-width:1.5; }
      .hdr    { fill:#1da1e0; }
      .hdrtxt { fill:#ffffff; font-size:15px; font-weight:700; }
      .chip   { fill:#e8f5fc; stroke:#bfe4f5; stroke-width:1; }
      .chiptxt{ fill:#0c5a80; font-size:13px; font-weight:600; }
      .title  { fill:#14181f; font-size:24px; font-weight:800; }
      .sub    { fill:#5b6472; font-size:13px; font-weight:500; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="648" fill="#f8fafc"/>

  <!-- Titre -->
  <rect x="40" y="30" width="6" height="42" rx="3" fill="#1da1e0"/>
  <text class="title" x="60" y="52">Technologies utilisées</text>
  <text class="sub"   x="60" y="76">Assistant FAQ ESSEC — pile technique du code actuel</text>

  <!-- ================= Colonne 1 ================= -->

  <!-- Frontend -->
  <rect class="card" x="40" y="120" width="400" height="150" rx="12"/>
  <path class="hdr" d="M40 132 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v22 h-400 z"/>
  <text class="hdrtxt" x="58" y="142">Frontend (navigateur)</text>
  <rect class="chip" x="58"  y="172" width="62"  height="30" rx="15"/><text class="chiptxt" x="89"  y="192" text-anchor="middle">HTML5</text>
  <rect class="chip" x="130" y="172" width="58"  height="30" rx="15"/><text class="chiptxt" x="159" y="192" text-anchor="middle">CSS3</text>
  <rect class="chip" x="198" y="172" width="96"  height="30" rx="15"/><text class="chiptxt" x="246" y="192" text-anchor="middle">JavaScript</text>
  <rect class="chip" x="58"  y="212" width="180" height="30" rx="15"/><text class="chiptxt" x="148" y="232" text-anchor="middle">Roboto (typographie)</text>

  <!-- Backend -->
  <rect class="card" x="40" y="292" width="400" height="150" rx="12"/>
  <path class="hdr" d="M40 304 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v22 h-400 z"/>
  <text class="hdrtxt" x="58" y="314">Backend (serveur)</text>
  <rect class="chip" x="58"  y="344" width="108" height="30" rx="15"/><text class="chiptxt" x="112" y="364" text-anchor="middle">Node.js ≥ 18</text>
  <rect class="chip" x="176" y="344" width="176" height="30" rx="15"/><text class="chiptxt" x="264" y="364" text-anchor="middle">Zéro dépendance npm</text>
  <rect class="chip" x="58"  y="384" width="252" height="30" rx="15"/><text class="chiptxt" x="184" y="404" text-anchor="middle">Modules natifs : http · fs · path</text>

  <!-- Recherche & données -->
  <rect class="card" x="40" y="464" width="400" height="150" rx="12"/>
  <path class="hdr" d="M40 476 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v22 h-400 z"/>
  <text class="hdrtxt" x="58" y="486">Recherche &amp; données</text>
  <rect class="chip" x="58"  y="516" width="118" height="30" rx="15"/><text class="chiptxt" x="117" y="536" text-anchor="middle">Elasticsearch</text>
  <rect class="chip" x="186" y="516" width="176" height="30" rx="15"/><text class="chiptxt" x="274" y="536" text-anchor="middle">Index « myessec_faq »</text>

  <!-- ================= Colonne 2 ================= -->

  <!-- IA / RAG -->
  <rect class="card" x="470" y="120" width="410" height="150" rx="12"/>
  <path class="hdr" d="M470 132 a12 12 0 0 1 12 -12 h386 a12 12 0 0 1 12 12 v22 h-410 z"/>
  <text class="hdrtxt" x="488" y="142">Réponse rédigée par IA (RAG)</text>
  <rect class="chip" x="488" y="172" width="252" height="30" rx="15"/><text class="chiptxt" x="614" y="192" text-anchor="middle">Databricks — Claude Sonnet 4.5</text>
  <rect class="chip" x="488" y="212" width="128" height="30" rx="15"/><text class="chiptxt" x="552" y="232" text-anchor="middle">Google Gemini</text>
  <rect class="chip" x="626" y="212" width="146" height="30" rx="15"/><text class="chiptxt" x="699" y="232" text-anchor="middle">Anthropic Claude</text>

  <!-- Déploiement -->
  <rect class="card" x="470" y="292" width="410" height="150" rx="12"/>
  <path class="hdr" d="M470 304 a12 12 0 0 1 12 -12 h386 a12 12 0 0 1 12 12 v22 h-410 z"/>
  <text class="hdrtxt" x="488" y="314">Déploiement</text>
  <rect class="chip" x="488" y="344" width="80"  height="30" rx="15"/><text class="chiptxt" x="528" y="364" text-anchor="middle">Docker</text>
  <rect class="chip" x="578" y="344" width="150" height="30" rx="15"/><text class="chiptxt" x="653" y="364" text-anchor="middle">Docker Compose</text>
  <rect class="chip" x="488" y="384" width="130" height="30" rx="15"/><text class="chiptxt" x="553" y="404" text-anchor="middle">Node Alpine</text>

  <!-- Qualité & versioning -->
  <rect class="card" x="470" y="464" width="410" height="150" rx="12"/>
  <path class="hdr" d="M470 476 a12 12 0 0 1 12 -12 h386 a12 12 0 0 1 12 12 v22 h-410 z"/>
  <text class="hdrtxt" x="488" y="486">Qualité &amp; versioning</text>
  <rect class="chip" x="488" y="516" width="118" height="30" rx="15"/><text class="chiptxt" x="547" y="536" text-anchor="middle">Git / GitHub</text>
  <rect class="chip" x="616" y="516" width="164" height="30" rx="15"/><text class="chiptxt" x="698" y="536" text-anchor="middle">Playwright (tests)</text>

  <!-- Pied -->
  <text class="sub" x="40" y="638">Flux : Navigateur (HTML/CSS/JS) → Node.js → Elasticsearch → IA (Databricks / Gemini / Anthropic) → réponse + sources</text>
</svg>
